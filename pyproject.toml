[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iwr-unified"
version = "1.0.0"
description = "Unified configuration-driven IWR, ET, yield, anomaly and plotting workflow"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "rioxarray>=0.15",
    "geoaquacrop_preprocess >=0.1.0",
    "soilgrids >=0.1.0"
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6",
]
geo = [
    "geopandas>=0.14",
    "shapely>=2.0",
]

netcdf = [
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "rioxarray>=0.15",
    "dask[array]>=2023.1",
]
test = [
    "pytest>=7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"